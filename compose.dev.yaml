services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: adrobot
      POSTGRES_USER: adrobot
      POSTGRES_PASSWORD: adrobot_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - adrobot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adrobot -d adrobot']
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  adrobot_pgdata:
