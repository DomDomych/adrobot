<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура Adrobot</title>
  <desc id="desc">Браузер обращается к Nginx, который раздаёт React и проксирует API в FastAPI. Backend обращается к PostgreSQL и внешнему Keitaro Admin API. Alembic выполняет миграции перед запуском backend.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="958" height="548" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#17263b">
    <text x="32" y="35" font-size="15" font-weight="700" letter-spacing="1.2" fill="#475569">ADROBOT / DOCKER COMPOSE</text>
    <rect x="240" y="66" width="474" height="452" rx="13" fill="#eaf0f8" stroke="#a8b8cc" stroke-dasharray="6 5"/>
    <text x="258" y="89" font-size="12" font-weight="600" fill="#52647b">Внутренняя сеть Docker Compose</text>
    <g fill="#fff" stroke="#9bacc2" stroke-width="1.3">
      <rect x="24" y="120" width="188" height="101" rx="9"/>
      <rect x="268" y="113" width="418" height="116" rx="9"/>
      <rect x="268" y="282" width="418" height="94" rx="9"/>
      <rect x="268" y="432" width="266" height="64" rx="9"/>
      <rect x="558" y="432" width="128" height="64" rx="9"/>
      <rect x="746" y="277" width="190" height="104" rx="9"/>
    </g>
    <g font-size="18" font-weight="650">
      <text x="42" y="149">Браузер</text>
      <text x="288" y="142">Nginx + React</text>
      <text x="288" y="313">FastAPI</text>
      <text x="288" y="457">PostgreSQL 16</text>
      <text x="574" y="457">Alembic</text>
      <text x="762" y="306">Keitaro</text>
    </g>
    <g font-size="13" fill="#52647b">
      <text x="42" y="173">Веб-интерфейс</text><text x="42" y="195">127.0.0.1:8080</text>
      <text x="288" y="165">React / TypeScript / Ant Design</text><text x="288" y="185">SPA и обратный прокси для API</text><text x="288" y="207">Публикуемый порт: 8080 (по умолчанию)</text>
      <text x="288" y="335">Бизнес-логика, черновики, синхронизация</text><text x="288" y="355">SQLAlchemy asyncio · asyncpg · HTTPX</text>
      <text x="288" y="478">Состояние редактора, журнал</text>
      <text x="574" y="478">Миграции</text>
      <text x="762" y="330">Admin API</text><text x="762" y="350">Внешний сервис</text><text x="762" y="367">Кампании и офферы</text>
    </g>
    <g stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#arrow)">
      <path d="M212 171 H268"/>
      <path d="M477 229 V282"/>
      <path d="M686 329 H746"/>
      <path d="M401 376 V432"/>
      <path d="M558 464 H534" stroke-dasharray="4 3"/>
    </g>
    <g font-size="12" fill="#475569"><text x="489" y="260">/api/v1</text><text x="411" y="408">SQL</text><text x="716" y="319" text-anchor="middle" font-size="10">HTTPS</text><text x="716" y="342" text-anchor="middle" font-size="10">REST</text></g>
    <text x="32" y="535" font-size="12" fill="#52647b">Backend и PostgreSQL не публикуют порты на хосте. Alembic выполняется до запуска backend.</text>
  </g>
</svg>
